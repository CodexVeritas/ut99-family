CacheText[0]="<p><img src='JBScreenTextures.JBBanner' width=192 height=58></p>\n\n<p><big><img src='JBScreenTextures.JBLogoRed' height=24 width=24>12-19-2005	</big></p>\n<p><big><b><font color=#6a4d83>planetjailbreak.com domain name</font></b></big></p>\n<p>I don't know how much you all know about the deeper workings of the internet, so here's the long version of the explanation...</p>\n<p>The Planet Jailbreak website is hosted by Beyond Unreal. That means the files that make up what you're reading now are stored on their server. The URL for that is http://jailbreak.beyondunreal.com .</p>\n<p>The domain name planetjailbreak.com also points to BU's server. You buy domain names like that from companies that add the name to the internet's Domain Name Servers (DNS). It was bought by Daikiki, way back in the mists of time. Now BU have moved their server, the DNS needs to be updated to point to the new server. However, we can't get hold of Daikiki. He's not been around Jailbreak for a very long time.</p>\n<p>The upshot of it a"
CacheText[1]="ll is this: it's best if you start using http://jailbreak.beyondunreal.com . The planetjailbreak.com appears to work, but that's because Beyond Unreal have set their old server to forward you, and that's not going to last for ever. We're really sorry about this.</p>\n<p>PS. Note also that the JDN's URL is http://mychaeel.no-ip.com/jailbreak/.</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoBlue' height=24 width=24>11-12-2005	</big></p>\n<p><big><b><font color=#6a4d83>BU moves hosts</font></b></big></p>\n<p>Beyond Unreal, our esteemed host site, has just completed a migration to a speedy new dual-3GHz server. If you're not yet able to access Planet Jailbreak on www.planetjailbreak.com, use http://jailbreak.beyondunreal.com until the DNS record for our domain name is updated. (Of course, if you're reading this, you probably are...)</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoRed' h"
CacheText[2]="eight=24 width=24>10-19-2005	</big></p>\n<p><big><b><font color=#6a4d83>In the Nyx of time</font></b></big></p>\n<p>Mapper INIQUITOUS has released his map Nyx, now available on Nali City. It's a fairly small map with a creative layout and some great scenery. Plus it comes with a skybox by Hazel.</p>\n<p>INIQUITOUS is already at work on his next project, Nautilus. Try the beta and let him know what you think.</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoBlue' height=24 width=24>10-12-2005	</big></p>\n<p><big><b><font color=#6a4d83>Lego bricks are go!</font></b></big></p>\n<p>I recently posted about 4WD's excellent Lego map, JB-SpaceLego, when it was in beta testing. It has now been released on NaliCity, so there's no excuse for not trying its execution sequence. It's destined to be a classic.</p>\n<p>Another recently-released map is TheHead's Cyanide: fast-paced and easy to pick up.</p>\n<p>If you fancy a bit of a walk on the wild side, there "
CacheText[3]="are several more maps in beta: Vatcilli zeitchef's Monody, AcydBurn's Apophis, and there's even talk of getting Spoondog's old map Isolated finished!</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n"
