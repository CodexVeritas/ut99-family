CacheText[0]="<script language=\qjavascript\q>document.write(\q<\q+\qscript type='text/javascript' src='http://wrapper.gamespyid.com/a?pagetype=hosted&size=prestitial'>\q);document.write(\q<\q+\q/script>\q);</script><html>\r\n  <head>\r\n    <title>screen :: about :: news (printable)</title>\r\n    <link rel=stylesheet type=\qtext/css\q href=\qscreen-print.css\q>\r\n  </head>\r\n  \r\n  <body>\r\n    <h1>news</h1>\r\n\r\n<img src=\qPlanetUnrealNews.jpg\q width=245 height=230 align=right hspace=20>\r\n\r\n\r\n\r\n  \r\n\r\n\r\n\r\n\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2003-07-05</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Screen 2003?</h2>\r\n        <p>I've lately been working on some <i>Screen</i>-related functionality for <a href='http://www.planetjailbreak.com'>Jailbreak 2003</a>, but I expect that I'll be able to detach those functions from Jailbreak to make a"
CacheText[1]=" stand-alone <i>Screen 2003</i> package quite easily.</p><p>On a related note, check my <a href='http://wiki.beyondunreal.com/wiki/Developer_Journals/Mychaeel'>developer journal</a> on the Unreal Wiki for more <i>Screen</i>-related progress news.</p><p>(And some GameSpy admin must have deleted part of the <i>Screen</i> website on GameSpy's dynamic content server... or there's something else going on I wasn't told about.)</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2002-06-04</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Screen 131 available for download</h2>\r\n        <p>At last, <i>Screen 131</i> is available for separate download as well.  Head over to the <a href='http://www.planetunreal.com/screen/download.html'>download page</a> and grab it if you didn't download it with <a href='http://www.pla"
CacheText[2]="netjailbreak.com' target=_blank>Jailbreak <span class='abbrev'>III</span></a>.  Then again, I can only highly recommend downloading Jailbreak <span class='abbrev'>III</span> to anyone anyway...</p><p>The latest version is <i>Screen 131</i>, not <i>Screen 130</i>.  The update between the two is only a fix to a minor, but pretty annoying bug for those who are affected by it:  Recording client-side demos crashes maps using any of the currently three network-supporting slide types (web, chat or server info).  Thanks to <a href='mailto:usaar33@usaar33.com'>usaar33</a> for pointing out the bug and suggesting a fix for it.</p><p>Now <a href='http://www.planetunreal.com/screen/download.html'>get <i>Screen</i></a>, have fun experimenting with it and let me know when you're releasing something that takes advantage of it.  And don't forget to visit the <a href='http://forums.beyondunreal.com/forumdisplay.php?forumid=149' target=_blank><i>Screen</i> forum</a> if you have questions or are looking for inspiration.</p>\r\"
CacheText[3]="n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2002-03-23</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Jailbreak III is out</h2>\r\n        <p><a href='http://www.planetjailbreak.com' target=_blank>Jailbreak <span class='abbrev'>III</span></a> is out, and it contains <i>Screen 130</i>.  Nuff said.  <a href='http://www.planetjailbreak.com' target=_blank>Head over</a> and get it now.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2002-03-01</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Screen 130 is close</h2>\r\n        <p>All new features are implemented, compatibility issues solved, and the (internal) b"
CacheText[4]="eta of <i>Screen 130</i> is finally out.  Yay!  And it's being bundled with the (also internal) first release candidate of <a href='http://www.planetjailbreak.com' target=_blank>Jailbreak <span class='abbrev'>III</span></a> that is due for release tonight.</p><p>Check the <a href='documentation.html'>documentation section</a> and the <a href='download-changes.html'>change history</a> for a glimpse into the guts of the new <i>Screen 130</i> features, among which are the new <a href='documentation-ScreenSlidePageChat.html'>ScreenSlidePageChat</a> that allows you to monitor and participate in an <span class='abbrev'>IRC</span> chat and <a href='documentation-ScreenSlidePageServer.html'>ScreenSlidePageServer</a> which displays game and player information queried from a remote Unreal Tournament game server.</p><p>In addition, <i>Screen 130</i> contains <a href='documentation-ScreenSlideMapAnchored.html'>ScreenSlideMapAnchored</a>, the groundwork for the portable <a href='http://forums.beyondunreal.com/showthread"
CacheText[5]=".php?threadid=93135'>ScreenPad device</a> that's currently in development.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2002-01-18</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>CameraSpot released</h2>\r\n        <p>Remember Duke Nukem's surveillance cameras?  When you approached and activated them, they showed you another part of the map from a surveillance camera's point of view, allowing you to check whether some door was open or closed, where enemies were hiding or where a special item was located.</p><p>The CameraSpot actor does the same for Unreal Tournament maps, and more. When triggered, the instigator's viewpoint switches to the CameraSpot; as soon as the instigator leaves the trigger's radius, his/her viewpoint is switched back to first-person view.</p><p>Check the <a href='http://www.planet"
CacheText[6]="unreal.com/screen/cameraspot/'>CameraSpot homepage</a> for more details, screenshots and downloads.</p><p>(Sorry, there's no way to make the camera view appear on a scripted texture. I'd like that as much as you do, but the Unreal engine simply doesn't provide the necessary means for that.)</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2002-01-05</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>ScreenPad progress</h2>\r\n        <p>Check <a href='http://forums.beyondunreal.com/showthread.php?s=&amp;threadid=93135'>this thread</a> in the <a href='http://forums.beyondunreal.com/forumdisplay.php?forumid=149'>Screen forum</a> for details on <i>ScreenPad</i>, a portable device that displays your friends and foes around you.  What do you think?  <a href='http://forums.beyondunreal.com/showthread.php?s=&amp;thre"
CacheText[7]="adid=93135'>Comment!</a></p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2001-12-09</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>MeshMaker released</h2>\r\n        <p>Not directly related to Screen, but hopefully interesting for you mappers out there anyway: I've released <a href='http://www.planetunreal.com/screen/meshmaker/'>MeshMaker</a>, a handy Windows-based tool that basically converts prefabs to ready-to-use decorations, allowing you to easily take advantage of the advantages meshes provide over intricate detail brushes. Check out the <a href='http://www.planetunreal.com/screen/meshmaker/'>MeshMaker walkthrough</a> and this <a href='http://forums.beyondunreal.com/showthread.php?s=&amp;threadid=95780'>BeyondUnreal forum thread</a> for more details.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n"
CacheText[8]="  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2001-11-28</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Next version coming up</h2>\r\n        <p>I'm still busy together with the rest of the team getting the next generation of <a href='http://jailbreak.beyondunreal.com'>Jailbreak</a> to beta stage for our impatient beta tester crew, but actually that's good news for everybody waiting for the upcoming <i>Screen</i> version too: <i>Screen 130</i> will come bundled with Jailbreak <span class='abbrev'>III</span>, and for reasons not only being the ton of Jailbreak maps that are using it already. Check out the <a href='http://forums.beyondunreal.com/forumdisplay.php?forumid=149'>Screen forums</a> for some hints, and stay tuned.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valig"
CacheText[9]="n=top>\r\n      <td class=\qnewsdate\q><nobr>2001-10-04</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Freya][ released</h2>\r\n        <p>As if to show off that <i>Screens</i> don't necessarily have to look like wall-mounted <span class='abbrev'>TV</span> sets, <a href='mailto:ericettes@freeler.nl'>SnowDog</a> has released <span class='abbrev'>JB</span>-Freya][. Apart from stunning visuals and great gameplay, this map features a coarse map outline drawn with chalk on one of the jail caves' walls which magically displays where the other players currently are running around. It's definitely worth a look, and if you don't have the JailBreak mod already, go to the <a href='http://www.planetunreal.com/utjb/'>JailBreak website</a> and download it at once.</p><p>Check out <a href='http://dynamic3.gamespy.com/~utjb/ikonboard/topic.cgi?forum=2&amp;topic=27' target=_blank>this thread</a> in the <a href='http://www.planetunreal.com/utjb/' "
CacheText[10]="target=_blank>JailBreak</a> forums to find out where to download the map and to give SnowDog your feedback. If you came here to download the latest version of the <i>Screen</i> component, grab it from the <a href='download.html'>download page</a>.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2001-10-03</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>News system up</h2>\r\n        <p>The new and shiny news system for the <i>Screen</i> website is up, and best of all, it allows me to keep this site entirely on the PlanetUnreal webserver. No weird frameset construction needed to redirect you to that dynamic content server without your knowledge. You're looking at pure static <span class='abbrev'>HTML</span> goodness.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpa"
CacheText[11]="dding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2001-09-05</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Tutorial updates</h2>\r\n        <p>I've added some (hopefully helpful) hints to the <a href='tutorials-screen-create.html'>Creating a screen in a map</a> and <a href='tutorials-slides-mapsurveillance.html'>Creating a map surveillance slide</a> tutorials. And I've updated the <a href='showcase.html'>Showcase</a> page with some work-in-progress bits.</p><p>In other news, thanks to <a href='mailto:acordero@terra.es'>Antonio Balcazar</a>'s quick response all technical issues concerning the map wireframe tool described below are solved, and all that's left to do for me is code it up. (Which might still take a while, so don't hold your breath, but it'll definitely come.)</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr v"
CacheText[12]="align=top>\r\n      <td class=\qnewsdate\q><nobr>2001-08-22</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Go Screen!</h2>\r\n        <p>For those of you who are considering whether to put some screens in your upcoming map or not, check out <a href='http://forums.planetunreal.com/showthread.php?threadid=78008' target=_blank>this thread</a> in <a href='http://www.planetunreal.com/' target=_blank>PlanetUnreal</a>'s forums.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n  <table border=0 cellpadding=0 cellspacing=0>\r\n    <tr valign=top>\r\n      <td class=\qnewsdate\q><nobr>2001-08-17</nobr></td>\r\n      <td><img src=\qspacer.gif\q alt=\q\q width=20 height=1></td>\r\n      <td>\r\n        <h2 class=\qnews\q>Tools</h2>\r\n        <p>For your mapping convenience while implementing screens in your maps I've created the <i>ScreenCache</i> tool that allows to modify the cached content displayed by web slides withou"
CacheText[13]="t the necessity to go online each and every time you test-run your map. Get it from the new <a href='download-tools.html'>tools download</a> page.</p><p>Apart from that, I'm planning to create a tool that greatly simplifies the creation of <a href='tutorials-slides-mapsurveillance.html'>map surveillance slides</a>, especially the creation of the texture displaying the map scheme. I have contacted <a href='mailto:acordero@terra.es'>Antonio Cordero</a>, developer of the excellent <a href='http://unreal.acordero.org/UTilities/utpt/' target=_blank><span class='abbrev'>UT</span> Package Tool</a> and its supporting Delphi unit that I'd like to use to extract the map geometry from map files, and currently we're both waiting for Epic's response to him on that matter. Let's wait and see.</p>\r\n      </td>\r\n    </tr>\r\n  </table>\r\n  <br><br>\r\n\r\n\r\n    \r\n    <p><img src=\qspacer.gif\q alt=\q\q width=1 height=20></p>\r\n    <p><small>Document located at <a href=\qindex.shtml\q>http://www.planetunreal.com/s"
CacheText[14]="creen/index.shtml</a> &#151; All content and design &copy; 2001-2002 by Mychaeel</small></p>\r\n  </body>\r\n</html>\r\n"
