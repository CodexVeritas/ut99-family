CacheText[0]="<p>Current <b>PlanetUnreal</b> news, straight from their front page:</p>\n\n<p><font color=#606060> </font><br>\n<b></b><br>\n</p>\n<p><font color=#606060> </font><br>\n<b></b><br>\n</p>\n<p><font color=#606060> </font><br>\n<b></b><br>\n</p>\n<p><font color=#606060> </font><br>\n<b></b><br>\n</p>\n<p><font color=#606060> </font><br>\n<b></b><br>\n</p>\n\n\n<p>Read the full stories at <b>PlanetUnreal</b>, the premier site for all your Unreal and Unreal Tournament needs.</p>\n<p><font color='#1c3a7f'><u>http://www.planetunreal.com</u></font></p>\n"
