CacheText[0]="<p><img src='JBScreenTextures.JBBanner' width=192 height=58></p>\n\n<p><big><img src='JBScreenTextures.JBLogoRed' height=24 width=24>02-15-2006	</big></p>\n<p><big><b><font color=#6a4d83>Stout, not symmetrical</font></b></big></p>\n<p>The dictionary tells me that stalwart means 'Firm and resolute; stout'. And some maps just don't go away, they resolutely keep coming back in new incarnations. Stalwart dates back from the original UT, and this latest version has been adapted for Jailbreak by 4WD from KillBait's own version of StalwartXL for UT2003.</p>\n<p>Unusually for Jailbreak, this map is non-symmetrical. It's quite a challenge with these to make sure play is balanced, and after we beta tested it online recently there was plenty of discussion about it. Get it from Nali City and try it for yourself.</p>\n<p>This map comes with a great execution sequence that had me burst out laughing during testing. The screenshot gives you a clue as to what fate might await you in jail.</p>\n<p><img src='JBScreenTextures."
CacheText[1]="JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoBlue' height=24 width=24>02-03-2006	</big></p>\n<p><big><b><font color=#6a4d83>Test results</font></b></big></p>\n<p>Everyone had a great time last night on the Jailbreak 2004 mothership. The new maps we were beta testing are excellent, and I hope to see them soon featured on Sunday Lockdown.</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoRed' height=24 width=24>01-31-2006	</big></p>\n<p><big><b><font color=#6a4d83>Testing, testing...</font></b></big></p>\n<p>You'd be forgiven for thinking things have been slow in the world of Jailbreak. That's partly my fault, as I've not been updating very much while we've had our DNS problem. But that is now fixed and we're back at planetjailbreak.com.</p>\n<p>The Jailbreak mappers have been productive over the holidays: Sexmachine has put four new maps on the mothership for beta testing. They are: Hazel's Collateral (pictured), 4WD'"
CacheText[2]="s conversion of StalwartXL, Rob's conversion of Deck17, and last but not least the long-awaited Isolated, created by Spoondog a very long time ago, and resurrected by G.Lecter. Rob's Deck17 is not the same as G.Lecter's Deck17 mentioned in the previous news post, there are two conversions of this map in the works, with different layouts.</p>\n<p>Beta testers will be meeting on the mothership this Thursday at the usual lockdown time, so make sure you have the four beta maps and join them!</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n<p><big><img src='JBScreenTextures.JBLogoBlue' height=24 width=24>01-09-2006	</big></p>\n<p><big><b><font color=#6a4d83>On the decks</font></b></big></p>\n<p>A belated happy new year to all you jailbreakers out there! The first piece of good news is that Daikiki has visited the forums with festive greetings, and so we've finally managed to talk to him about updating our DNS.</p>\n<p>Forum regular G.Lecter, well-known for his extensive testing of mappers' "
CacheText[3]="work in progress, has announced a project of his own for new year. Some time ago there was a discussion about how to do a Deck-17 conversion. G.Lecter has now gone ahead and realized his own vision of this favourite. Grab it from this forum thread.</p>\n<p><img src='JBScreenTextures.JBLine' width=196 height=4></p>\n\n"
